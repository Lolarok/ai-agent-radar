<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>🤖 AI Agent Crypto Radar</title>
<style>
  :root {
    --bg: #0a0a12;
    --surface: #12121e;
    --surface2: #1a1a2e;
    --border: #2a2a40;
    --accent: #9945ff;
    --accent-glow: rgba(153, 69, 255, 0.15);
    --cyan: #14f195;
    --green: #22c55e;
    --red: #ef4444;
    --yellow: #eab308;
    --orange: #f97316;
    --blue: #3b82f6;
    --text: #e8e8f0;
    --dim: #6a6a8a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 30px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
    gap: 12px;
  }

  .header h1 {
    font-size: 22px;
    font-weight: 700;
    background: linear-gradient(135deg, var(--accent), var(--cyan));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .header .subtitle {
    font-size: 12px;
    color: var(--dim);
  }

  .header .meta {
    text-align: right;
  }

  .header .meta .updated {
    font-size: 12px;
    color: var(--dim);
  }

  .stats-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
    padding: 16px 30px;
  }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 20px;
  }

  .stat-card .label {
    font-size: 11px;
    text-transform: uppercase;
    color: var(--dim);
    letter-spacing: 0.5px;
    margin-bottom: 4px;
  }

  .stat-card .value {
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
  }

  .stat-card .value.green { color: var(--green); }
  .stat-card .value.red { color: var(--red); }
  .stat-card .value.accent { color: var(--accent); }

  .container {
    padding: 0 30px 20px;
  }

  /* Sector tabs */
  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    flex-wrap: wrap;
    padding-top: 6px;
  }

  .tab {
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 13px;
    background: var(--surface2);
    color: var(--dim);
    border: 1px solid var(--border);
    cursor: pointer;
    transition: all 0.2s;
    user-select: none;
  }

  .tab:hover { background: var(--accent-glow); color: var(--text); border-color: var(--accent); }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* Table */
  .table-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow-x: auto;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }

  thead th {
    text-align: left;
    padding: 12px 16px;
    color: var(--dim);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }

  thead th:hover { color: var(--text); }
  thead th.sorted { color: var(--accent); }
  thead th.sorted::after { content: ' ↕'; }

  tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background 0.15s;
  }

  tbody tr:hover { background: var(--accent-glow); }
  tbody tr:last-child { border-bottom: none; }

  td {
    padding: 10px 16px;
    white-space: nowrap;
  }

  .token-name {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .token-name .rank {
    color: var(--dim);
    font-size: 12px;
    min-width: 24px;
  }

  .token-name img {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--surface2);
  }

  .token-name .info .name {
    font-weight: 600;
    font-size: 14px;
  }

  .token-name .info .symbol {
    font-size: 11px;
    color: var(--dim);
  }

  .change {
    font-weight: 600;
    font-size: 13px;
  }

  .change.green { color: var(--green); }
  .change.red { color: var(--red); }

  .price { font-weight: 600; font-variant-numeric: tabular-nums; }

  /* Score bar */
  .score-cell {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .score-bar {
    width: 80px;
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
  }

  .score-bar .fill {
    height: 100%;
    border-radius: 3px;
    transition: width 0.5s ease;
  }

  .score-num {
    font-weight: 700;
    font-size: 14px;
    min-width: 32px;
  }

  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 600;
  }

  .badge.strong { background: rgba(34,197,94,0.15); color: var(--green); }
  .badge.uptrend { background: rgba(20,241,149,0.12); color: var(--cyan); }
  .badge.neutral { background: rgba(234,179,8,0.12); color: var(--yellow); }
  .badge.downtrend { background: rgba(249,115,22,0.12); color: var(--orange); }
  .badge.weak { background: rgba(239,68,68,0.12); color: var(--red); }

  .mcap { font-variant-numeric: tabular-nums; color: var(--dim); font-size: 13px; }

  /* Sector summary */
  .sector-summary {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 12px;
    margin-top: 20px;
  }

  .sector-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 18px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .sector-card:hover { border-color: var(--accent); background: var(--accent-glow); }

  .sector-card .s-name {
    font-size: 12px;
    text-transform: uppercase;
    color: var(--dim);
    letter-spacing: 0.5px;
  }

  .sector-card .s-score {
    font-size: 20px;
    font-weight: 700;
  }

  .sector-card .s-detail {
    font-size: 11px;
    color: var(--dim);
  }

  .loading {
    text-align: center;
    padding: 80px 20px;
    color: var(--dim);
  }

  .loading .spinner {
    display: inline-block;
    width: 32px;
    height: 32px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .error {
    text-align: center;
    padding: 60px 20px;
    color: var(--red);
  }

  /* Footer */
  footer {
    text-align: center;
    padding: 16px;
    color: var(--dim);
    font-size: 11px;
    border-top: 1px solid var(--border);
    margin-top: 20px;
  }

  footer a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>🤖 AI Agent Crypto Radar</h1>
    <div class="subtitle">Real-time tracker for autonomous AI agent tokens</div>
  </div>
  <div class="meta">
    <div class="updated" id="updated">Loading...</div>
    <div class="subtitle" style="margin-top:2px" id="count"></div>
  </div>
</div>

<div class="stats-row" id="stats">
  <div class="stat-card"><div class="label">Total Tokens</div><div class="value" id="s-total">—</div></div>
  <div class="stat-card"><div class="label">DeFi TVL</div><div class="value accent" id="s-tvl">—</div></div>
  <div class="stat-card"><div class="label">🔥 Strong</div><div class="value green" id="s-strong">—</div></div>
  <div class="stat-card"><div class="label">❄️ Weak</div><div class="value red" id="s-weak">—</div></div>
  <div class="stat-card"><div class="label">Best 24h Gainer</div><div class="value green" id="s-gainer">—</div></div>
</div>

<div class="container">
  <div class="tabs" id="tabs">
    <div class="tab active" data-sector="all">All</div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th data-col="market_cap_rank" class="sorted" style="width:50px">#</th>
          <th data-col="name">Token</th>
          <th data-col="current_price">Price</th>
          <th data-col="price_change_percentage_24h">24h</th>
          <th data-col="price_change_percentage_7d">7d</th>
          <th data-col="price_change_percentage_30d">30d</th>
          <th data-col="market_cap" style="text-align:right">Market Cap</th>
          <th data-col="composite_score">Score</th>
          <th data-col="ath_change_percentage">ATH Δ</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <div class="sector-summary" id="sectors"></div>
</div>

<footer>
  Data from CoinGecko API · Scores are composite signals, not financial advice · 
  <a href="https://github.com/Lolarok/ai-agent-radar">GitHub</a>
</footer>

<script>
const DATA_URL = 'ai-agents.json';
let allData = null;
let currentSector = 'all';
let sortCol = 'composite_score';
let sortAsc = false;

function fmtPrice(n) {
  if (n == null || isNaN(n)) return '—';
  if (n >= 1000) return '$' + n.toLocaleString('en', {maximumFractionDigits: 2});
  if (n >= 1) return '$' + n.toFixed(2);
  if (n >= 0.01) return '$' + n.toFixed(4);
  return '$' + n.toFixed(6);
}

function fmtMcap(n) {
  if (!n) return '—';
  if (n >= 1e12) return '$' + (n/1e12).toFixed(2) + 'T';
  if (n >= 1e9) return '$' + (n/1e9).toFixed(1) + 'B';
  if (n >= 1e6) return '$' + (n/1e6).toFixed(1) + 'M';
  return '$' + n.toLocaleString();
}

function fmtChg(n) {
  if (n == null) return '—';
  const a = n > 0 ? '▲' : n < 0 ? '▼' : '–';
  return `${a} ${Math.abs(n).toFixed(1)}%`;
}

function chgClass(n) {
  if (!n) return '';
  return n > 0 ? 'green' : n < 0 ? 'red' : '';
}

function scoreColor(s) {
  if (s >= 70) return 'var(--green)';
  if (s >= 55) return 'var(--cyan)';
  if (s >= 40) return 'var(--yellow)';
  if (s >= 25) return 'var(--orange)';
  return 'var(--red)';
}

function scoreBadge(label) {
  const l = label.toLowerCase().replace(/[❄️🔥📈📉🟡]/g, '').trim();
  let cls = 'neutral';
  if (l === 'strong') cls = 'strong';
  else if (l === 'uptrend') cls = 'uptrend';
  else if (l === 'downtrend') cls = 'downtrend';
  else if (l === 'weak') cls = 'weak';
  return `<span class="badge ${cls}">${label}</span>`;
}

function fmtTVL(n) {
  if (!n) return '—';
  if (n >= 1e12) return '$' + (n/1e12).toFixed(2) + 'T';
  if (n >= 1e9) return '$' + (n/1e9).toFixed(0) + 'B';
  return '$' + (n/1e6).toFixed(0) + 'M';
}

function render() {
  if (!allData) return;
  const d = allData;
  const tokens = currentSector === 'all' ? d.tokens : d.tokens.filter(t => t.sector === currentSector);
  tokens.sort((a,b) => {
    let va = a[sortCol], vb = b[sortCol];
    if (va == null) va = -Infinity;
    if (vb == null) vb = -Infinity;
    return sortAsc ? va - vb : vb - va;
  });

  // Stats
  document.getElementById('s-total').textContent = d.total_tokens;
  document.getElementById('s-tvl').textContent = fmtTVL(d.defi_tvl);
  document.getElementById('s-strong').textContent = d.tokens.filter(t => t.composite_score >= 70).length;
  document.getElementById('s-weak').textContent = d.tokens.filter(t => t.composite_score < 25).length;
  const best = d.tokens.reduce((a,b) => a.price_change_percentage_24h > b.price_change_percentage_24h ? a : b, d.tokens[0]);
  document.getElementById('s-gainer').textContent = best ? `${best.symbol} ${fmtChg(best.price_change_percentage_24h)}` : '—';
  document.getElementById('count').textContent = `${d.tokens.length} AI tokens tracked`;
  document.getElementById('updated').textContent = 'Updated: ' + new Date(d.timestamp).toLocaleString();

  // Tabs
  const tabContainer = document.getElementById('tabs');
  const sectors = [...new Set(d.tokens.map(t => t.sector))].sort();
  tabContainer.innerHTML = `<div class="tab ${currentSector==='all'?'active':''}" data-sector="all">All</div>`;
  sectors.forEach(s => {
    tabContainer.innerHTML += `<div class="tab ${currentSector===s?'active':''}" data-sector="${s}">${s}</div>`;
  });
  tabContainer.querySelectorAll('.tab').forEach(el => {
    el.addEventListener('click', () => { currentSector = el.dataset.sector; render(); });
  });

  // Table
  const tbody = document.getElementById('tbody');
  if (tokens.length === 0) {
    tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;padding:40px;color:var(--dim)">No tokens in this sector yet</td></tr>';
  } else {
    tbody.innerHTML = tokens.map((t,i) => `
      <tr>
        <td><span class="rank">${t.market_cap_rank || '—'}</span></td>
        <td>
          <div class="token-name">
            <div class="info">
              <div class="name">${t.name}</div>
              <div class="symbol">${t.symbol}</div>
            </div>
          </div>
        </td>
        <td class="price">${fmtPrice(t.current_price)}</td>
        <td class="change ${chgClass(t.price_change_percentage_24h)}">${fmtChg(t.price_change_percentage_24h)}</td>
        <td class="change ${chgClass(t.price_change_percentage_7d)}">${fmtChg(t.price_change_percentage_7d)}</td>
        <td class="change ${chgClass(t.price_change_percentage_30d)}">${fmtChg(t.price_change_percentage_30d)}</td>
        <td style="text-align:right" class="mcap">${fmtMcap(t.market_cap)}</td>
        <td>
          <div class="score-cell">
            <div class="score-bar"><div class="fill" style="width:${t.composite_score}%;background:${scoreColor(t.composite_score)}"></div></div>
            <span class="score-num" style="color:${scoreColor(t.composite_score)}">${t.composite_score.toFixed(0)}</span>
          </div>
        </td>
        <td class="change ${chgClass(t.ath_change_percentage)}">${t.ath_change_percentage != null ? fmtChg(t.ath_change_percentage) : '—'}</td>
      </tr>
    `).join('');
  }

  // Sector cards
  const sectDiv = document.getElementById('sectors');
  if (d.sector_summary) {
    sectDiv.innerHTML = Object.entries(d.sector_summary)
      .sort((a,b) => b[1].avg_score - a[1].avg_score)
      .map(([name, s]) => `
        <div class="sector-card" onclick="currentSector='${name}';render();">
          <div class="s-name">${name}</div>
          <div class="s-score" style="color:${scoreColor(s.avg_score)}">${s.avg_score}</div>
          <div class="s-detail">${s.count} tokens · avg 24h: <span class="${chgClass(s.avg_change_24h)}">${fmtChg(s.avg_change_24h)}</span></div>
        </div>
      `).join('');
  }

  // Sort headers
  document.querySelectorAll('thead th[data-col]').forEach(th => {
    th.classList.toggle('sorted', th.dataset.col === sortCol);
  });
}

// Click to sort
document.querySelectorAll('thead th[data-col]').forEach(th => {
  th.addEventListener('click', () => {
    if (sortCol === th.dataset.col) sortAsc = !sortAsc;
    else { sortCol = th.dataset.col; sortAsc = false; }
    render();
  });
});

// Load data
async function loadData() {
  try {
    const r = await fetch(DATA_URL + '?t=' + Date.now());
    if (r.ok) {
      allData = await r.json();
      render();
    } else {
      document.getElementById('stats').innerHTML = '<div class="error">Failed to load data. The scanner hasn\'t run yet — it runs via GitHub Actions every 6 hours.</div>';
    }
  } catch(e) {
    document.getElementById('stats').innerHTML = '<div class="error">Failed to load data: ' + e.message + '</div>';
  }
}

loadData();
</script>

</body>
</html>
